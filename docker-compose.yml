# Hạ tầng cho luồng offline.
#
#   docker compose up -d
#   docker compose ps
#   dashboard: http://localhost:6333/dashboard
#
# Postgres chưa có ở đây — sẽ thêm khi làm sổ ghi trạng thái document
# (doc status, content_hash, resume). Hiện tại trạng thái nằm ở data/artifacts.

services:
  qdrant:
    # TODO: ghim version cụ thể trước khi lên production; `latest` để dev cho nhanh
    image: qdrant/qdrant:latest
    container_name: vicoze-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST + dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      # Log gọn lại, mặc định khá ồn
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # image không có curl/wget -> dùng bash mở TCP socket
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # Named volume: vector sống lâu hơn container. `docker compose down` KHÔNG mất
  # dữ liệu; muốn xoá sạch phải `docker compose down -v`.
  qdrant_storage:

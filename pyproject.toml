[project]
name = "vi-coze"
version = "0.1.0"
requires-python = ">=3.11,<3.14"  # onnxruntime (qua markitdown) chưa có wheel cp314

# Khai báo phụ thuộc DUY NHẤT của repo. requirements.txt cũ của nhánh rag_phase3
# đã gộp vào đây: nó khai báo 7 gói không import ở đâu (FlagEmbedding, pandas,
# beautifulsoup4, scikit-learn, tqdm, python-dotenv, chromadb) và thiếu 5 gói
# đang được import thật (docling, tiktoken, pillow, openai, networkx...).
#
# Mặc định chỉ cài phần cần cho nhánh SQL. Hai nhánh còn lại nặng nên tách extra:
#     uv sync                      pipeline schema SQL
#     uv sync --extra kg           + module knowledge graph chạy riêng
#     uv sync --extra rag_docs     + pipeline PDF    (src/branch_rag_docs)
#     uv sync --all-extras         tất cả
dependencies = [
    "markitdown[docx,pdf]>=0.1.1",    # docs -> markdown (pdf: pdfminer.six, nhẹ)
    "openpyxl>=3.1",                  # XLSX -> markdown trong branch_sql_MVP
    "markdown-it-py>=3.0",            # markdown -> block (parse/blocks.py)
    "langchain-core>=1.0",            # Document, Runnable/LCEL
    "langchain-text-splitters>=1.0",  # MarkdownHeaderTextSplitter
    "langchain-huggingface>=0.3",     # HuggingFaceEmbeddings
    "langchain-classic>=1.0.8",       # EnsembleRetriever, CrossEncoderReranker
    "sentence-transformers>=3.0",     # backend cho embedding + reranker
    "torch==2.11.0",                  # CUDA wheel: dense + reranker chạy GPU
    "torchvision==0.26.0",            # khớp torch 2.11, Docling cũng sử dụng
    "qdrant-client>=1.12",            # vector store
    "fastembed>=0.8.0",               # BM25 sparse
    "networkx>=3.2",                  # GraphRAG MVP + community detection
    "pydantic>=2.9",
    "sentencepiece>=0.2.2",
]

[project.optional-dependencies]
# src/retrieval/knowledge.py + kg_* — knowledge graph, chạy LLM qua endpoint OpenAI-compatible
kg = [
    "openai>=1.40",
    "pyvis>=0.3.2",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
]

# src/branch_sql/online/llm — binding LangChain cho 4 provider trong .env.
# ChatOpenAI dùng chung cho cả OpenAI lẫn OpenRouter (endpoint OpenAI-compatible).
llm = [
    "langchain-openai>=1.6",
    "langchain-google-genai>=4.3",
    "langchain-nvidia-ai-endpoints>=1.4",
]

# src/branch_sql/eval/gold_parse.py — đọc bộ testcase .xlsx
eval = [
    "openpyxl>=3.1",
]

# src/branch_sql/api — server điều khiển pipeline từ trình duyệt. Chỉ hai gói:
# pydantic đã có sẵn nên FastAPI dùng thẳng KnowledgeCfg/ChunkCfg làm request body.
api = [
    "fastapi>=0.115",
    "gradio>=5.0",
    "uvicorn>=0.32",
    "python-multipart>=0.0.9",
]

# src/branch_sql/offline/parse/pdf_parse.py — đọc .pdf ở nhánh SQL. Chỉ docling,
# không kéo theo chroma/tiktoken như extra rag_docs.
pdf = [
    "docling>=2.0",
]

# src/branch_rag_docs — pipeline PDF. docling kéo theo model layout/OCR, khá nặng.
rag_docs = [
    "docling>=2.0",
    "langchain-chroma>=0.1.2",
    "tiktoken>=0.7",
    "pillow>=10.0",
    "transformers>=4.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=7.0",
    "nbclient>=0.11",
    "nbformat>=5.10",
]

# Chạy bằng `python -m src.<...>` từ gốc repo, không cài như package.
[tool.uv]
package = false

# Dense embedding và Vietnamese reranker chạy GPU. CUDA 12.8 tương thích với
# driver NVIDIA của máy dev; wheel đã kèm CUDA runtime, không cần cài toolkit.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

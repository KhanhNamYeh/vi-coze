[project]
name = "vi-coze"
version = "0.1.0"
requires-python = ">=3.11,<3.14"  # onnxruntime (qua markitdown) chưa có wheel cp314
dependencies = [
    "markitdown[docx]>=0.1.1",        # docs -> markdown
    "langchain-core>=1.0",            # Document, Runnable/LCEL
    "langchain-text-splitters>=1.0",  # MarkdownHeaderTextSplitter
    "langchain-huggingface>=0.3",     # HuggingFaceEmbeddings
    "sentence-transformers>=3.0",     # backend cho embedding model
    "qdrant-client>=1.12",            # vector store
    "pydantic>=2.9",
    "fastembed>=0.8.0",
    "langchain-classic>=1.0.8",
    "sentencepiece>=0.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

# Chạy bằng `python -m src.<...>` từ gốc repo, không cài như package.
[tool.uv]
package = false

# torch mặc định trên Windows/Linux kéo theo cả runtime CUDA (~2,5 GB).
# Embedding chạy CPU là đủ với khối lượng này -> lấy wheel CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
